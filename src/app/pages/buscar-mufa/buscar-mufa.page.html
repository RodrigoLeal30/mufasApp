<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Buscar Mufa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding fondo-oc">
  <ion-list class="fondo-lista">
    <ion-item *ngFor="let oc of ocList$ | async" (click)="goToOC(oc.id)">
      <ion-label>{{ oc.nombre | titlecase }}</ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
