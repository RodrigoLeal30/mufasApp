<ion-header>
  <ion-toolbar>
    <ion-title>Mufas</ion-title>
    
  </ion-toolbar>
</ion-header>

<ion-content class="contenedor">
  <ion-list>
   <ion-item-sliding *ngFor="let mufa of mufas">
  <ion-item (click)="verDetalle(mufa.id)">
    <ion-label>{{ mufa.nombre }}</ion-label>
  </ion-item>

  <!-- Botón editar al deslizar hacia la derecha -->
  <ion-item-options side="start">
    <ion-item-option style="--background: #fbc02d;" (click)="editarMufa(mufa)">
      <ion-icon slot="icon-only" name="create-outline" style="color: red !important; font-size: 30px;"></ion-icon>
    </ion-item-option>
  </ion-item-options>

  <!-- Botón eliminar al deslizar hacia la izquierda -->
  <ion-item-options side="end">
    <ion-item-option style="--background: #d32f2f;" (click)="eliminarMufa(mufa.id)">
      <ion-icon slot="icon-only" name="trash-outline" style="color: white !important; font-size: 30px;"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
  </ion-list>
</ion-content>
