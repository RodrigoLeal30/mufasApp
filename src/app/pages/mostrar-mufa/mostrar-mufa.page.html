<ion-header>
  <ion-toolbar>
    <ion-title>Mostrar Mufa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="mufaForm">

    <!-- Nombre -->
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input formControlName="nombre" type="text"></ion-input>
    </ion-item>

    <!-- Tipo -->
    <ion-item>
      <ion-label>Tipo</ion-label>
      <ion-select formControlName="tipo">
        <ion-select-option value="Aérea">Aérea</ion-select-option>
        <ion-select-option value="Cámara">Cámara</ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Imagen -->
    <ion-item *ngIf="fotoUrl">
      <ion-label>Foto actual:</ion-label>
      <img [src]="fotoUrl" class="imagen-mufa" />
    </ion-item>

    <ion-item>
      <ion-label>Nueva foto (opcional)</ion-label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    </ion-item>

    <!-- Lista de cables -->
    <ion-list [formGroup]="mufaForm">
  <div formArrayName="cables">
    <ion-item *ngFor="let cable of cables.controls; let i = index" [formGroupName]="i">
      <ion-label position="stacked">Capacidad</ion-label>
      <ion-input type="number" formControlName="capacidad"></ion-input>

      <ion-label position="stacked">Lote</ion-label>
      <ion-input type="text" formControlName="lote"></ion-input>

      <ion-button color="danger" (click)="eliminarCable(i)">Eliminar</ion-button>
    </ion-item>
  </div>
</ion-list>

    <!-- Botones -->
    <ion-button expand="block" color="primary" (click)="guardarCambios()">Guardar Cambios</ion-button>
    <ion-button expand="block" color="danger" (click)="eliminarMufa()">Eliminar Mufa</ion-button>

  </form>
</ion-content>
