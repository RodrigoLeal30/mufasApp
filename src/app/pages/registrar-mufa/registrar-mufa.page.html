<ion-header>
  <ion-toolbar>
    <ion-title>Registrar Mufa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="mufaForm" (ngSubmit)="registrarMufa()">

    <!-- Nombre -->
    <ion-item>
      <ion-label position="floating">Nombre de la Mufa</ion-label>
      <ion-input formControlName="nombre" type="text"></ion-input>
    </ion-item>

    <!-- Tipo -->
    <ion-item>
      <ion-label>Tipo</ion-label>
      <ion-select formControlName="tipo">
        <ion-select-option value="Aérea">Aérea</ion-select-option>
        <ion-select-option value="Cámara">Cámara</ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Latitud y Longitud (solo info) -->
    <ion-item>
      <ion-label>Latitud: {{ lat }}</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Longitud: {{ lng }}</ion-label>
    </ion-item>

    <!-- Lista de Cables -->
    <ion-list>
      <ion-list-header>
        <ion-label>Cables</ion-label>
      </ion-list-header>

      <div formArrayName="cables">
        <div *ngFor="let cable of cables.controls; let i = index" [formGroupName]="i">

          <ion-item>
            <ion-label>Capacidad</ion-label>
            <ion-select formControlName="capacidad">
              <ion-select-option value="8">8</ion-select-option>
              <ion-select-option value="16">16</ion-select-option>
              <ion-select-option value="32">32</ion-select-option>
              <ion-select-option value="64">64</ion-select-option>
              <ion-select-option value="96">96</ion-select-option>
              <ion-select-option value="128">128</ion-select-option>
              <ion-select-option value="256">256</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Código/Lote del cable</ion-label>
            <ion-input formControlName="lote" type="text"></ion-input>
          </ion-item>

          <ion-button expand="block" color="danger" (click)="eliminarCable(i)">
            Eliminar Cable
          </ion-button>

        </div>
      </div>

      <ion-button expand="block" fill="outline" (click)="agregarCable()">
        + Agregar Cable
      </ion-button>
    </ion-list>

    <!-- Imagen -->
    <ion-item>
      <ion-label>Foto (opcional)</ion-label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    </ion-item>

    <!-- Botón Registrar -->
    <ion-button expand="block" type="submit" [disabled]="mufaForm.invalid">
      Registrar Mufa
    </ion-button>

  </form>
</ion-content>
